<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
  </head>
  <body>
    <script>
      (function() {
        var l = window.location;
        var repo = '%PUBLIC_URL%';
        var path = l.pathname + l.search + l.hash;
        sessionStorage.setItem('gh-spa-redirect', JSON.stringify({ path: path.replace(repo, '') }));
        l.replace(repo + '/');
      })();
    </script>
  </body>
</html>
